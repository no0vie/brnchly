name: Publish packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only; do not publish
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce release ref policy
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/tags/v1.0.0" ]]; then
            echo "Publishing validation is allowed only from main or the v1.0.0 tag; got $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify release manifests
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const readPackage = async (path) => JSON.parse(await readFile(path, "utf8"));
          const core = await readPackage("packages/core/package.json");
          const react = await readPackage("packages/react/package.json");
          const expectedVersion = "1.0.0";

          const checks = [
            [core.name, "@no0vie/brnchly-core", "core package name"],
            [core.version, expectedVersion, "core version"],
            [react.name, "@no0vie/brnchly-react", "React package name"],
            [react.version, expectedVersion, "React version"],
            [react.dependencies?.["@no0vie/brnchly-core"], expectedVersion, "React core dependency"],
          ];

          for (const [actual, expected, label] of checks) {
            if (actual !== expected) throw new Error(`${label} must be exactly ${expected}; got ${actual}`);
          }
          NODE
      - run: npm test
      - run: npm run pack:dry-run
      - run: npm run test:consumer

  publish:
    if: ${{ inputs.dry_run == false }}
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify npm identity
        run: npm whoami
      - name: Verify target versions are unpublished
        shell: bash
        run: |
          check_unpublished() {
            local package="$1"
            local output
            local status

            set +e
            output="$(npm view "${package}@1.0.0" version 2>&1)"
            status=$?
            set -e

            if [[ $status -eq 0 ]]; then
              echo "${package}@1.0.0 is already published; refusing to overwrite or continue." >&2
              exit 1
            fi
            if grep -q "E404" <<<"$output"; then
              echo "${package}@1.0.0 is unpublished (expected E404)."
              return
            fi

            echo "$output" >&2
            echo "Registry preflight failed without the expected unpublished E404 for ${package}@1.0.0." >&2
            exit 1
          }

          check_unpublished "@no0vie/brnchly-core"
          check_unpublished "@no0vie/brnchly-react"
      - run: npm run build:packages
      - run: npm publish packages/core --provenance
      - run: npm publish packages/react --provenance
